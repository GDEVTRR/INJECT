
name: INJECT

options:
  bundleIdPrefix: com.gdev
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"

targets:
  INJECT:
    type: application
    platform: iOS

    sources:
      - path: core/INJECTCore
      - path: core/INJECTUI

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gdev.inject
        PRODUCT_NAME: INJECT
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: INJECT
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
